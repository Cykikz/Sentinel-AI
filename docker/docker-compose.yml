services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "7890:7890"
    volumes:
      - ../demo:/workspace
    environment:
      DEMO_MODE: "true"
      BACKEND_PORT: "7890"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:7890"
    depends_on:
      - backend
